app = "formcoachdesk"
primary_region = "nrt"

[env]
NODE_ENV = "production"
DEPLOYMENT_TARGET = "production"
HOST = "0.0.0.0"
PORT = "3000"

[http_service]
internal_port = 3000
force_https = true
auto_stop_machines = "off"
auto_start_machines = false

[[http_service.checks]]
grace_period = "15s"
interval = "30s"
method = "GET"
timeout = "10s"
path = "/api/ready"

[[vm]]
cpu_kind = "shared"
cpus = 1
memory = "512mb"
