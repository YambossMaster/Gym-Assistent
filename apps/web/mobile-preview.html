<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>手機畫面預覽 | FORM Coach Desk</title>
    <style>
      :root {
        font-family: system-ui, sans-serif;
        color: #22231e;
        background: #f2f1eb;
      }

      body {
        margin: 0;
        padding: 24px 16px 40px;
      }

      main {
        display: grid;
        justify-items: center;
        gap: 16px;
      }

      header {
        width: min(100%, 390px);
      }

      h1 {
        margin: 0 0 6px;
        font-size: 20px;
      }

      p {
        margin: 0;
        line-height: 1.5;
        color: #55564f;
        font-size: 14px;
      }

      iframe {
        display: block;
        width: 390px;
        height: 844px;
        max-width: none;
        border: 1px solid #c9c9c1;
        border-radius: 18px;
        background: white;
        box-shadow: 0 18px 45px #22231e26;
      }

      .frame-scroll {
        max-width: 100%;
        overflow-x: auto;
        padding: 2px 12px 20px;
      }

      a {
        color: #37543c;
      }
    </style>
  </head>
  <body>
    <main>
      <header>
        <h1>手機畫面預覽</h1>
        <p>畫面尺寸：390 × 844。可在下方直接操作應用並切換頁面。</p>
      </header>
      <div class="frame-scroll">
        <iframe title="FORM Coach Desk 手機畫面，390 × 844" src="/today"></iframe>
      </div>
      <p>這是桌機瀏覽器中的手機尺寸預覽。<a href="/today">開啟一般畫面</a></p>
    </main>
  </body>
</html>
