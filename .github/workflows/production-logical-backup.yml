name: Production logical backup

on:
  schedule:
    - cron: '17 2 * * *'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  dump:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    concurrency:
      group: production-logical-backup
      cancel-in-progress: false
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_PRODUCTION_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_PRODUCTION_DB_PASSWORD }}
      SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PRODUCTION_PROJECT_ID }}
      BACKUP_PASSPHRASE: ${{ secrets.PRODUCTION_BACKUP_PASSPHRASE }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Require backup credentials
        shell: bash
        run: |
          set -euo pipefail
          test -n "$SUPABASE_ACCESS_TOKEN"
          test -n "$SUPABASE_DB_PASSWORD"
          test "$SUPABASE_PROJECT_ID" = 'febunjhpruqlywjfvuaq'
          test "${#BACKUP_PASSPHRASE}" -ge 32

      - name: Resolve Production IPv4 session pooler
        env:
          SUPABASE_POOLER_CACHE_ROOT: ${{ runner.temp }}
        run: node scripts/cache-supabase-pooler.mjs

      - name: Install locked CLI
        run: npm ci

      - name: Link Production project
        run: npx supabase link --project-ref "$SUPABASE_PROJECT_ID"

      - name: Restore verified pooler endpoint
        run: cp "$RUNNER_TEMP/supabase/.temp/pooler-url" supabase/.temp/pooler-url

      - name: Dump roles, schema, data and migration history
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          mkdir -p "$RUNNER_TEMP/logical-backup"
          npx supabase db dump --linked --role-only -f "$RUNNER_TEMP/logical-backup/roles.sql"
          npx supabase db dump --linked -f "$RUNNER_TEMP/logical-backup/schema.sql"
          npx supabase db dump --linked --data-only --use-copy \
            -x storage.buckets_vectors -x storage.vector_indexes \
            -f "$RUNNER_TEMP/logical-backup/data.sql"
          npx supabase db dump --linked --schema supabase_migrations \
            -f "$RUNNER_TEMP/logical-backup/history_schema.sql"
          npx supabase db dump --linked --data-only --use-copy --schema supabase_migrations \
            -f "$RUNNER_TEMP/logical-backup/history_data.sql"
          cd "$RUNNER_TEMP/logical-backup"
          for file in roles.sql schema.sql data.sql history_schema.sql history_data.sql; do
            test -s "$file"
          done
          grep -Eq '^(COPY|INSERT INTO) ("?auth"?\.)"?users"?' data.sql
          date -u +'%Y-%m-%dT%H:%M:%SZ' > created-at-utc.txt
          printf '%s\n' "$GITHUB_SHA" > source-commit.txt
          sha256sum *.sql > SHA256SUMS

      - name: Encrypt backup before artifact upload
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          printf '%s' "$BACKUP_PASSPHRASE" > "$RUNNER_TEMP/backup.pass"
          tar -C "$RUNNER_TEMP/logical-backup" -czf "$RUNNER_TEMP/backup.tar.gz" .
          gpg --batch --yes --pinentry-mode loopback \
            --passphrase-file "$RUNNER_TEMP/backup.pass" --cipher-algo AES256 \
            --symmetric --output "$RUNNER_TEMP/production-backup.tar.gz.gpg" \
            "$RUNNER_TEMP/backup.tar.gz"
          gpg --batch --yes --pinentry-mode loopback \
            --passphrase-file "$RUNNER_TEMP/backup.pass" --decrypt \
            "$RUNNER_TEMP/production-backup.tar.gz.gpg" >/dev/null
          sha256sum "$RUNNER_TEMP/production-backup.tar.gz.gpg"

      - name: Upload encrypted seven-day recovery artifact
        uses: actions/upload-artifact@v4
        with:
          name: production-logical-backup-${{ github.run_id }}
          path: ${{ runner.temp }}/production-backup.tar.gz.gpg
          if-no-files-found: error
          retention-days: 7

      - name: Download the uploaded artifact for the manual restore drill
        if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/codex/m8d-backup-drill'
        uses: actions/download-artifact@v4
        with:
          name: production-logical-backup-${{ github.run_id }}
          path: ${{ runner.temp }}/downloaded-backup

      - name: Restore the downloaded backup in a network-isolated database
        if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/codex/m8d-backup-drill'
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          encrypted="$RUNNER_TEMP/downloaded-backup/production-backup.tar.gz.gpg"
          cmp -s "$RUNNER_TEMP/production-backup.tar.gz.gpg" "$encrypted"
          mkdir -p "$RUNNER_TEMP/restore-input" "$RUNNER_TEMP/restore-project/supabase/migrations"
          gpg --batch --yes --pinentry-mode loopback \
            --passphrase-file "$RUNNER_TEMP/backup.pass" --decrypt \
            --output "$RUNNER_TEMP/restore-input.tar.gz" "$encrypted"
          tar -C "$RUNNER_TEMP/restore-input" -xzf "$RUNNER_TEMP/restore-input.tar.gz"
          cd "$RUNNER_TEMP/restore-input"
          sha256sum --check SHA256SUMS
          created_epoch="$(date -u -d "$(cat created-at-utc.txt)" +%s)"
          age_seconds="$(( $(date -u +%s) - created_epoch ))"
          test "$age_seconds" -ge 0
          test "$age_seconds" -le 172800
          echo 'PASS source recovery point is within 48 hours.'
          # The local CLI postgres role cannot replay the managed grant on a
          # logging parameter. Preserve the source artifact and omit only that
          # grant from this disposable restore copy after checksum verification.
          logging_grants="$(grep -Eic '^GRANT SET ON PARAMETER "?log_min_messages"? TO ' roles.sql || true)"
          test "$logging_grants" -eq 1
          test "$logging_grants" -eq "$(grep -ic 'log_min_messages' roles.sql || true)"
          sed -E '/^GRANT SET ON PARAMETER "?log_min_messages"? TO /Id' \
            roles.sql > restore-roles.sql
          echo 'Omitted the managed log_min_messages grant from local restore roles.'
          cp "$GITHUB_WORKSPACE/supabase/config.toml" \
            "$RUNNER_TEMP/restore-project/supabase/config.toml"
          sed -i 's/^project_id = .*/project_id = "m8d_restore_probe"/' \
            "$RUNNER_TEMP/restore-project/supabase/config.toml"
          sed -i '/^\[db.migrations\]/,/^\[/{s/^enabled = true$/enabled = false/;}' \
            "$RUNNER_TEMP/restore-project/supabase/config.toml"
          sed -i '/^\[db.seed\]/,/^\[/{s/^enabled = true$/enabled = false/;}' \
            "$RUNNER_TEMP/restore-project/supabase/config.toml"
          cd "$GITHUB_WORKSPACE"
          if ! env SUPABASE_ACCESS_TOKEN= SUPABASE_DB_PASSWORD= SUPABASE_PROJECT_ID= \
            npx supabase db start --workdir "$RUNNER_TEMP/restore-project"; then
            docker ps -a --format 'container {{.Names}}: {{.Status}}'
            exit 1
          fi
          container="$(docker ps --filter 'name=supabase_db_' --format '{{.ID}}')"
          test -n "$container"
          test "$(printf '%s\n' "$container" | grep -c .)" -eq 1
          echo 'PASS exactly one local Supabase DB container is running.'
          networks="$(docker inspect -f '{{range $name, $_ := .NetworkSettings.Networks}}{{println $name}}{{end}}' "$container")"
          test -n "$networks"
          while IFS= read -r network; do
            test -n "$network" && docker network disconnect --force "$network" "$container"
          done <<< "$networks"
          test -z "$(docker inspect -f '{{range $name, $_ := .NetworkSettings.Networks}}{{println $name}}{{end}}' "$container")"
          echo 'PASS restore container has no Docker network attached.'
          docker exec "$container" mkdir -p /tmp/m8d-backup
          docker cp "$RUNNER_TEMP/restore-input/." "$container:/tmp/m8d-backup/"
          docker cp "$GITHUB_WORKSPACE/scripts/r15-billing-paid-restore-fixture.sql" \
            "$container:/tmp/m8d-backup/r15-billing-paid-restore-fixture.sql"
          docker exec "$container" psql -U postgres -d postgres --single-transaction \
            --variable ON_ERROR_STOP=1 \
            --file /tmp/m8d-backup/restore-roles.sql \
            --file /tmp/m8d-backup/schema.sql \
            --command 'SET session_replication_role = replica' \
            --file /tmp/m8d-backup/data.sql
          docker exec "$container" psql -U postgres -d postgres --single-transaction \
            --variable ON_ERROR_STOP=1 \
            --file /tmp/m8d-backup/history_schema.sql \
            --file /tmp/m8d-backup/history_data.sql
          auth_count="$(docker exec "$container" psql -U postgres -d postgres -Atqc 'select count(*) from auth.users')"
          workspace_count="$(docker exec "$container" psql -U postgres -d postgres -Atqc 'select count(*) from app_private.workspace')"
          migration_count="$(docker exec "$container" psql -U postgres -d postgres -Atqc "select count(*) from supabase_migrations.schema_migrations where version = '20261010110051'")"
          test "$auth_count" -ge 1
          test "$workspace_count" -ge 1
          test "$migration_count" -eq 1
          billing_version="$(docker exec "$container" psql -U postgres -d postgres -Atqc "select count(*) from supabase_migrations.schema_migrations where version = '20261017181022'")"
          if [ "$billing_version" -eq 1 ]; then
            billing_tables="$(docker exec "$container" psql -U postgres -d postgres -Atqc "select count(*) from pg_tables where schemaname = 'app_private' and tablename in ('billing_checkout_account','billing_checkout_quote','billing_checkout_intent','billing_event_inbox','billing_subscription_ledger','billing_invoice_ledger','billing_cancellation','billing_verified_period','billing_trial_change','billing_paid_upgrade_evidence','billing_paid_change','billing_refund_case','billing_refund_case_application')")"
            test "$billing_tables" -eq 13
            billing_orphans="$(docker exec "$container" psql -U postgres -d postgres -Atqc "select count(*) from app_private.billing_invoice_ledger i left join app_private.billing_subscription_ledger s on s.environment=i.environment and s.store_id=i.store_id and s.provider_id=i.subscription_id and s.workspace_id=i.workspace_id where s.provider_id is null")"
            test "$billing_orphans" -eq 0
            period_orphans="$(docker exec "$container" psql -U postgres -d postgres -Atqc "select count(*) from app_private.billing_verified_period p left join app_private.billing_subscription_ledger s on s.environment=p.environment and s.store_id=p.store_id and s.provider_id=p.subscription_id and s.workspace_id=p.workspace_id where s.provider_id is null")"
            test "$period_orphans" -eq 0
            fixture_workspace="$(docker exec "$container" psql -U postgres -d postgres -Atqc "select w.id from app_private.workspace w where not exists (select 1 from app_private.billing_checkout_account a where a.workspace_id=w.id and a.environment='test') order by w.id limit 1")"
            test -n "$fixture_workspace"
            docker exec "$container" psql -U postgres -d postgres --single-transaction \
              --variable ON_ERROR_STOP=1 --variable "fixture_workspace=$fixture_workspace" \
              --file /tmp/m8d-backup/r15-billing-paid-restore-fixture.sql
            tables=(billing_checkout_account billing_checkout_quote billing_checkout_intent billing_subscription_ledger billing_invoice_ledger billing_verified_period)
            filters=("workspace_id='$fixture_workspace' and environment='test'" \
              "id='f1500000-0000-4000-8000-000000000001'" \
              "id='f1500000-0000-4000-8000-000000000002'" \
              "environment='test' and store_id='r15-restore-fixture' and provider_id='r15-paid-subscription'" \
              "environment='test' and store_id='r15-restore-fixture' and provider_id='r15-paid-invoice'" \
              "environment='test' and store_id='r15-restore-fixture' and subscription_id='r15-paid-subscription'")
            for index in "${!tables[@]}"; do
              docker exec "$container" psql -U postgres -d postgres --variable ON_ERROR_STOP=1 \
                --command "\copy (select * from app_private.${tables[$index]} where ${filters[$index]}) to '/tmp/r15-${tables[$index]}.csv' with (format csv, header true)"
            done
            docker exec "$container" psql -U postgres -d postgres --variable ON_ERROR_STOP=1 \
              --command "delete from app_private.billing_checkout_account where workspace_id='$fixture_workspace' and environment='test'"
            fixture_remaining="$(docker exec "$container" psql -U postgres -d postgres -Atqc "select count(*) from app_private.billing_subscription_ledger where environment='test' and store_id='r15-restore-fixture'")"
            test "$fixture_remaining" -eq 0
            restore_args=()
            for table in "${tables[@]}"; do
              restore_args+=(--command "\copy app_private.$table from '/tmp/r15-$table.csv' with (format csv, header true)")
            done
            docker exec "$container" psql -U postgres -d postgres --single-transaction \
              --variable ON_ERROR_STOP=1 "${restore_args[@]}"
            paid_join="$(docker exec "$container" psql -U postgres -d postgres -Atqc "select count(*) from app_private.billing_checkout_account a join app_private.billing_checkout_quote q on q.workspace_id=a.workspace_id and q.environment=a.environment join app_private.billing_checkout_intent c on c.quote_id=q.id and c.workspace_id=a.workspace_id and c.environment=a.environment join app_private.billing_subscription_ledger s on s.intent_id=c.id and s.workspace_id=a.workspace_id and s.environment=a.environment join app_private.billing_invoice_ledger i on i.subscription_id=s.provider_id and i.workspace_id=s.workspace_id and i.environment=s.environment and i.store_id=s.store_id join app_private.billing_verified_period p on p.invoice_id=i.provider_id and p.subscription_id=s.provider_id and p.workspace_id=s.workspace_id and p.environment=s.environment and p.store_id=s.store_id where s.environment='test' and s.store_id='r15-restore-fixture' and s.provider_id='r15-paid-subscription' and a.workspace_id='$fixture_workspace'")"
            test "$paid_join" -eq 1
            echo 'PASS restored R15 tables and synthetic paid checkout/subscription/invoice/period owner join after offline CSV round-trip.'
          else
            test "$billing_version" -eq 0
            echo 'R15 billing migration absent from source backup; paid-ledger restore gate remains open.'
          fi
          printf 'Restored aggregate counts: Auth users=%s, Workspaces=%s, latest migration=%s.\n' \
            "$auth_count" "$workspace_count" "$migration_count"
          echo 'PASS downloaded artifact decrypt, checksum, isolated restore and data read-back.'

      - name: Remove runner plaintext and passphrase
        if: always()
        shell: bash
        run: |
          rm -rf -- "$RUNNER_TEMP/logical-backup"
          rm -rf -- "$RUNNER_TEMP/restore-input" "$RUNNER_TEMP/downloaded-backup"
          rm -f -- "$RUNNER_TEMP/backup.tar.gz" "$RUNNER_TEMP/backup.pass" "$RUNNER_TEMP/restore-input.tar.gz"
