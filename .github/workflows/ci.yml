name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      docs_only: ${{ steps.scope.outputs.docs_only }}
      production_migration: ${{ steps.scope.outputs.production_migration }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Select verification scope
        id: scope
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.sha }}
          EVENT_NAME: ${{ github.event_name }}
        run: node scripts/ci-scope.mjs

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check documentation formatting
        if: steps.scope.outputs.docs_only == 'true'
        run: npm run format:check

      - name: Check formatting, types, and tests
        if: steps.scope.outputs.docs_only != 'true'
        run: npm run check

      - name: Build production applications
        if: steps.scope.outputs.docs_only != 'true'
        run: npm run build

  browser-ui:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Select verification scope
        id: scope
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.sha }}
          EVENT_NAME: ${{ github.event_name }}
        run: node scripts/ci-scope.mjs

      - name: Changes without Web impact need no browser check
        if: steps.scope.outputs.browser_needed != 'true'
        run: echo "No Web or browser inputs changed."

      - name: Set up Node.js
        if: steps.scope.outputs.browser_needed == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        if: steps.scope.outputs.browser_needed == 'true'
        run: npm ci

      - name: Install Chromium
        if: steps.scope.outputs.browser_needed == 'true'
        run: npx playwright install --with-deps chromium

      - name: Verify Plan Choice in desktop and mobile browser
        if: steps.scope.outputs.browser_needed == 'true'
        run: npm run test:browser

      - name: Upload browser failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-ui-failure
          path: test-results/
          if-no-files-found: ignore

  migration-dry-run:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Select verification scope
        id: scope
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.sha }}
          EVENT_NAME: ${{ github.event_name }}
        run: node scripts/ci-scope.mjs

      - name: Documentation-only commit needs no migration check
        if: steps.scope.outputs.docs_only == 'true'
        run: echo "No code or migration files changed."

      - name: Set up Node.js
        if: steps.scope.outputs.docs_only != 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        if: steps.scope.outputs.docs_only != 'true'
        run: npm ci

      - name: Require Supabase CI secrets
        if: steps.scope.outputs.docs_only != 'true'
        shell: bash
        run: |
          test -n "$SUPABASE_ACCESS_TOKEN"
          test -n "$SUPABASE_DB_PASSWORD"
          test -n "$SUPABASE_PROJECT_ID"

      - name: Link development project
        if: steps.scope.outputs.docs_only != 'true'
        run: npx supabase link --project-ref "$SUPABASE_PROJECT_ID"

      - name: Verify remote migration plan
        if: steps.scope.outputs.docs_only != 'true'
        run: npm run db:push:dry

  production-migration-preview:
    if: >-
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      pending: ${{ steps.migration_state.outputs.pending }}
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_PRODUCTION_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_PRODUCTION_DB_PASSWORD }}
      SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PRODUCTION_PROJECT_ID }}
    steps:
      - name: Check out exact release commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Select verification scope
        id: scope
        env:
          BASE_SHA: ${{ github.event.before }}
          HEAD_SHA: ${{ github.sha }}
          EVENT_NAME: ${{ github.event_name }}
        run: node scripts/ci-scope.mjs

      - name: Set up Node.js
        if: steps.scope.outputs.docs_only != 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Require production Supabase secrets
        if: steps.scope.outputs.docs_only != 'true'
        shell: bash
        run: |
          test -n "$SUPABASE_ACCESS_TOKEN"
          test -n "$SUPABASE_DB_PASSWORD"
          test -n "$SUPABASE_PROJECT_ID"

      - name: Verify Production pooler access before installing dependencies
        if: steps.scope.outputs.docs_only != 'true'
        env:
          SUPABASE_POOLER_CACHE_ROOT: ${{ runner.temp }}
        run: node scripts/cache-supabase-pooler.mjs

      - name: Install dependencies
        if: steps.scope.outputs.docs_only != 'true'
        run: npm ci

      - name: Link production project
        if: steps.scope.outputs.docs_only != 'true'
        run: npx supabase link --project-ref "$SUPABASE_PROJECT_ID"

      - name: Restore verified IPv4 pooler endpoint after linking
        if: steps.scope.outputs.docs_only != 'true'
        run: cp "$RUNNER_TEMP/supabase/.temp/pooler-url" supabase/.temp/pooler-url

      - name: Compare Production migration history with this commit
        if: steps.scope.outputs.docs_only != 'true'
        id: migration_state
        shell: bash
        run: |
          set -euo pipefail
          npx supabase migration list --linked --output-format json |
            node scripts/production-migration-state.mjs

      - name: Preview production migrations
        if: >-
          steps.migration_state.outputs.pending == 'true' ||
          steps.scope.outputs.production_migration == 'true'
        run: npm run db:push:dry

      - name: Hold deployment for explicit migration release
        if: >-
          steps.migration_state.outputs.pending == 'true' ||
          steps.scope.outputs.production_migration == 'true'
        run: |
          echo "Production dry-run passed. Automatic deploy is intentionally held."
          echo "Run the Production migration release workflow for this exact commit."

  deploy-production:
    needs:
      - verify
      - browser-ui
      - migration-dry-run
      - production-migration-preview
    if: >-
      always() &&
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main' &&
      needs.verify.result == 'success' &&
      needs.browser-ui.result == 'success' &&
      needs.migration-dry-run.result == 'success' &&
      needs.production-migration-preview.result == 'success' &&
      needs.production-migration-preview.outputs.pending == 'false' &&
      needs.verify.outputs.docs_only != 'true' &&
      needs.verify.outputs.production_migration != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    concurrency:
      group: production-release
      cancel-in-progress: false
    env:
      FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
      VITE_SUPABASE_URL: ${{ vars.PRODUCTION_SUPABASE_URL }}
      VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.PRODUCTION_SUPABASE_PUBLISHABLE_KEY }}
      VITE_SUPPORT_EMAIL: ${{ vars.PRODUCTION_SUPPORT_EMAIL }}
    steps:
      - name: Check out exact release commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Require production deployment configuration
        shell: bash
        run: |
          test -n "$FLY_API_TOKEN"
          test -n "$VITE_SUPABASE_URL"
          test -n "$VITE_SUPABASE_PUBLISHABLE_KEY"
          test -n "$VITE_SUPPORT_EMAIL"

      - name: Set up Fly CLI
        uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Reject deployment superseded by a newer Main change
        shell: bash
        run: |
          git fetch origin main:refs/remotes/origin/main
          node scripts/require-current-release.mjs

      - name: Deploy exact commit to Fly
        run: >-
          flyctl deploy
          --remote-only
          --ha=false
          --config deploy/fly.production.toml
          --dockerfile Dockerfile
          --build-arg VITE_SUPABASE_URL="$VITE_SUPABASE_URL"
          --build-arg VITE_SUPABASE_PUBLISHABLE_KEY="$VITE_SUPABASE_PUBLISHABLE_KEY"
          --build-arg VITE_SUPPORT_EMAIL="$VITE_SUPPORT_EMAIL"
          --build-arg VITE_INTERNAL_ALPHA=false

      - name: Verify production readiness
        shell: bash
        run: >-
          curl
          --fail
          --silent
          --show-error
          --max-time 10
          --retry 12
          --retry-all-errors
          --retry-delay 5
          https://formcoachdesk.com/api/ready

      - name: Report Fly state after a failed readiness check
        if: failure()
        timeout-minutes: 2
        shell: bash
        run: |
          flyctl status --app formcoachdesk
          flyctl checks list --app formcoachdesk
          flyctl machine list --app formcoachdesk
